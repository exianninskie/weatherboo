name: weatherboo
description: Your daily weather, but make it wholesome.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  supabase_flutter: ^2.3.3
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  http: ^1.2.0
  flutter_local_notifications: ^17.0.0
  google_generative_ai: ^0.4.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.1.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
